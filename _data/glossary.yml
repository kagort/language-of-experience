- id: kvalia
  term: "Квалиа"
  original: "qualia (лат.)"
  tradition: western
  definition: >
    Субъективные, качественные характеристики сознательного опыта — то, «каково это» видеть
    красный цвет, чувствовать боль или слышать звук. Термин введён К. И. Льюисом (1929),
    популяризован Томасом Нагелем («Каково быть летучей мышью?», 1974) и Дэвидом Чалмерсом.
    Квалиа — ядро «трудной проблемы сознания»: почему физические процессы сопровождаются
    субъективным переживанием? Некоторые философы отрицают существование квалиа как самостоятельной
    категории (элиминативизм), другие считают их фундаментальной чертой реальности.
  related: [intentionalnost, trudnaya_problema, phenomenologiya, svasamvedana]

- id: intentionalnost
  term: "Интенциональность"
  original: "intentionality (англ.), Intentionalität (нем.)"
  tradition: western
  definition: >
    Свойство сознания быть направленным на объект — его «о-чём-ностность». Введено в философию
    Францем Брентано, развито Эдмундом Гуссерлем как центральная тема феноменологии. Каждый
    акт сознания (восприятие, мышление, желание) имеет интенциональную структуру: noesis
    (акт направленности) и noema (содержание, на которое направлен акт). Мерло-Понти расширил
    концепцию до «моторной интенциональности» тела, действующего в мире ещё до рефлексии.
  related: [kvalia, phenomenologiya, voploshchennost]

- id: phenomenologiya
  term: "Феноменология"
  original: "Phänomenologie (нем.)"
  tradition: western
  definition: >
    Философский метод и направление, основанное Эдмундом Гуссерлем: строгое описание структур
    сознательного опыта «как он дан», с «вынесением за скобки» вопроса о существовании внешнего
    мира (эпохе). Гуссерль исследовал временнóе сознание, интенциональность, интерсубъективность.
    Хайдеггер переориентировал феноменологию на онтологию бытия-в-мире. Мерло-Понти сделал
    центральной темой воплощённое восприятие. В современности феноменология диалогирует
    с когнитивной наукой в рамках «нейрофеноменологии» Варелы.
  related: [intentionalnost, voploshchennost, kvalia]

- id: voploshchennost
  term: "Воплощённость"
  original: "embodiment (англ.), Leiblichkeit (нем.)"
  tradition: western
  definition: >
    Тезис о том, что познание, восприятие и сознание конститутивно связаны с телесной
    организацией субъекта и его пребыванием в мире. Введён Мерло-Понти в «Феноменологии
    восприятия» (1945): тело — не объект среди объектов, а «моторное ego», схема действия,
    через которую открывается мир. В когнитивной науке — основа «4E-когниции»: embodied,
    embedded, enacted, extended. Сближается с буддийским вниманием к телесным практикам
    и святоотеческой аскезой.
  related: [intentionalnost, phenomenologiya, telo]

- id: prediktivnoe_kodirovanie
  term: "Предиктивное кодирование"
  original: "predictive coding (англ.)"
  tradition: western
  definition: >
    Нейронаучная и философская теория, утверждающая, что мозг непрерывно генерирует
    предсказания о сенсорных входах и обновляет их на основе ошибок предсказания.
    Развита Карлом Фристоном как «принцип свободной энергии». Восприятие — не пассивная
    регистрация, а активное конструирование гипотез. Теория сближается с буддийской
    концепцией алаявиджняны как «хранилища отпечатков», формирующих опыт, и с
    идеями Абхинавагупты о самораскрытии сознания.
  related: [konstruirovannaya_emotsiya, alayavijnyana]

- id: konstruirovannaya_emotsiya
  term: "Конструированная эмоция"
  original: "constructed emotion (англ.)"
  tradition: western
  definition: >
    Теория Лизы Фельдман Барретт: эмоции не врождённые универсальные реакции, а активные
    конструкции мозга, создаваемые из аффективного тона (валентность + возбуждение),
    концептов и контекста. Каждая культура формирует собственный эмоциональный словарь,
    влияя на само переживание. Теория опирается на предиктивное кодирование: мозг
    «изобретает» эмоцию, опираясь на прошлый опыт и социальные категории. Перекликается
    с буддийским анализом санкхара (ментальных формаций) и ведантийской концепцией майи.
  related: [prediktivnoe_kodirovanie, chitta_vritti]

- id: fizikalizm
  term: "Физикализм"
  original: "physicalism (англ.)"
  tradition: western
  definition: >
    Онтологическая позиция: всё существующее физично или супервентно на физическом.
    В философии сознания физикализм утверждает, что ментальные состояния тождественны
    или функционально реализованы в физических (нейронных) процессах. Элиминативный
    материализм Черчленда идёт дальше: «народная психология» с её квалиа и интенциями
    должна быть вытеснена нейронаукой. Оппозиция физикализму — дуализм свойств Чалмерса,
    указывающий на «объяснительный разрыв».
  related: [kvalia, trudnaya_problema]

- id: trudnaya_problema
  term: "Трудная проблема сознания"
  original: "hard problem of consciousness (англ.)"
  tradition: western
  definition: >
    Термин Дэвида Чалмерса (1995): «лёгкие» проблемы сознания — объяснение когнитивных
    функций — решаемы в принципе нейронаукой, но остаётся «трудная»: почему вообще существует
    субъективный опыт? Почему физические процессы сопровождаются «каково это быть»? Чалмерс
    аргументирует, что физикалистские объяснения неполны концептуально. Проблема перекликается
    с буддийским «парадоксом пустоты» и апофатическим богословием.
  related: [kvalia, fizikalizm]

- id: yazyk_igra
  term: "Язык как форма жизни"
  original: "Lebensform, Sprachspiel (нем.)"
  tradition: western
  definition: >
    Понятие позднего Витгенштейна («Философские исследования», 1953): значение слова —
    не частный ментальный образ, а его употребление в «языковой игре», вплетённой в
    «форму жизни» (Lebensform) сообщества. Опровержение «приватного языка»: язык
    конститутивно публичен и интерсубъективен. Перекликается с индийской концепцией
    шабда-брахмана (звук как онтологическая основа) и патристическим логосом.
  related: [yazyk, shabda_brahman, logos]

- id: nus
  term: "Нус"
  original: "νοῦς (греч.)"
  tradition: patristic
  definition: >
    В святоотеческой традиции — высшая духовная способность человека, орган богопознания,
    отличный от рассудка (διάνοια) и рассуждения. У Евагрия нус — «место Бога» в человеке,
    способное к «чистой молитве» без образов и понятий. Очищенный нус способен к
    «умозрению» (θεωρία) — непосредственному созерцанию Бога в свете Фаворском.
    Близок к понятию «сердца» у аскетических писателей и к атману в адвайта-веданте.
  related: [serdtse, isihazm, atman]

- id: isihazm
  term: "Исихазм"
  original: "ἡσυχασμός (греч.), от ἡσυχία — покой, тишина"
  tradition: patristic
  definition: >
    Духовная практика и богословская традиция Православной Церкви, направленная на
    достижение безмолвия (исихия) как условия богообщения. В XIV в. Григорий Палама
    богословски обосновал практику умной молитвы и реальность Фаворского света как
    нетварной энергии Бога, отличной от непознаваемой сущности. Исихазм объединяет
    телесную аскезу, дыхательные практики, непрестанную молитву Иисусову и «хранение ума».
  related: [isihiya, umnaya_molitva, serdtse, pomysly]

- id: umnaya_molitva
  term: "Умная молитва"
  original: "νοερὰ προσευχή (греч.)"
  tradition: patristic
  definition: >
    Практика непрестанной молитвы умом в сердце, описанная в «Добротолюбии». Молитва
    Иисусова («Господи Иисусе Христе, Сыне Божий, помилуй мя») повторяется ритмично,
    постепенно «нисходя» из головы в сердце. Цель — стяжание Святого Духа через
    непрерывное памятование Бога. Сопоставима с джапой в индийской традиции и
    медитацией самадхи в буддизме.
  related: [isihazm, serdtse, nus]

- id: serdtse
  term: "Сердце (кардиа)"
  original: "καρδία (греч.)"
  tradition: patristic
  definition: >
    В святоотеческой антропологии — центр личности, духовный орган, в котором
    встречаются ум (нус) и благодать. Не физиологический орган, но глубина духа:
    «внутренний человек» по апостолу Павлу. Феофан Затворник: «Сердце — средоточие
    духовной жизни». Хранение сердца (nepsis) от помыслов — ключевая аскетическая задача.
    Параллель с хридаям («пещерой сердца») в упанишадах.
  related: [nus, umnaya_molitva, isihazm]

- id: logos
  term: "Логос"
  original: "λόγος (греч.)"
  tradition: patristic
  definition: >
    В патристике — второе Лицо Пресвятой Троицы, воплощённое в Иисусе Христе (Ин. 1:1).
    У Максима Исповедника — «логосы» тварных вещей суть мысли Бога, их внутренние законы
    и смыслы, через которые творение участвует в Логосе. Иустин Мученик видел в
    языческих мыслителях «семена Логоса» (λόγος σπερματικός). Понятие соединяет
    греческую метафизику с библейским откровением.
  related: [nus, yazyk_igra, shabda_brahman]

- id: sinergiya
  term: "Синергия"
  original: "συνεργία (греч.) — соработничество"
  tradition: patristic
  definition: >
    Совместное действие Божественной благодати и человеческой воли в деле спасения.
    Ориген, Макарий, Максим Исповедник: человек не пассивен — он сотрудничает с
    Богом, устремляя свою волю к Нему. Синергия — альтернатива и монергизму
    (спасение исключительно Богом без участия воли) и пелагианству (спасение
    собственными усилиями). В этом контексте сопоставима с буддийской «срединностью»
    между детерминизмом и абсолютной свободой воли.
  related: [nus, isihazm]

- id: isihiya
  term: "Исихия"
  original: "ἡσυχία (греч.) — покой, безмолвие"
  tradition: patristic
  definition: >
    Состояние внутреннего безмолвия, тишины ума и страстей, к которому стремится
    исихастская практика. Исихия — не пассивность, а особое внимание (nepsis):
    трезвение, бодрствование духа, свободного от рассеяния и помыслов. У Евагрия
    близка к «апатии» (apatheia) — невозмутимости, очищенной от страстей.
    Соответствует буддийскому «шаматхе» (успокоению) и индийской «читта-вритти-ниродхе».
  related: [isihazm, umnaya_molitva, nirvana]

- id: obozhenie
  term: "Обожение (феозис)"
  original: "θέωσις (греч.)"
  tradition: patristic
  definition: >
    Цель христианской жизни по учению отцов: человек призван стать богом по благодати,
    сохраняя свою тварную природу. Афанасий Великий: «Бог стал человеком, чтобы человек
    стал богом». Максим Исповедник разработал концепцию обожения как теозиса через
    синергию, таинства и аскезу. Параллель с мокшей в индуизме и нирваной в буддизме —
    при существенном различии: обожение — не слияние с Богом, а личностное соединение.
  related: [sinergiya, isihazm, moksha]

- id: brahman
  term: "Брахман"
  original: "brahman (санскр.)"
  tradition: hindu
  definition: >
    Высшая реальность, абсолютное бытие-сознание-блаженство (сат-чит-ананда) в
    адвайта-веданте Шанкары. Брахман — единственная подлинная реальность; весь
    феноменальный мир — его проявление через майю (иллюзию). Рамануджа в вишишта-адвайте
    утверждает, что Брахман — личный Бог (Ишвара), а мир и джива — его «тело», реально
    от него отличное. Абхинавагупта в кашмирском шиваизме отождествляет Брахмана с
    Шивой-Сознанием.
  related: [atman, maya, moksha]

- id: atman
  term: "Атман"
  original: "ātman (санскр.)"
  tradition: hindu
  definition: >
    Истинное «я» человека, индивидуальное сознание, которое в адвайта-веданте тождественно
    Брахману (формула «tat tvam asi» — «ты есть то»). Атман — не эмпирическое эго,
    а чистое свидетельствующее сознание, остающееся неизменным при смене состояний:
    бодрствования, сна со сновидениями и глубокого сна. Рамана Махарши предлагал
    «само-исследование» (вичара): «кто я?» — как прямой путь к реализации Атмана.
    Буддизм противопоставляет этому концепцию анатты.
  related: [brahman, anatman, samadhi, turiya]

- id: chitta_vritti
  term: "Читта-вритти"
  original: "citta-vṛtti (санскр.)"
  tradition: hindu
  definition: >
    Читта — «вещество» ума, хранилище впечатлений (самскар) и тенденций; вритти —
    «волнения», модификации ума: восприятие, вывод, воображение, сон, память.
    Патанджали определяет йогу как «читта-вритти-ниродха» — прекращение, усмирение
    колебаний ума. Когда вритти утихают, Атман сияет в своей истинной природе.
    Сравнимо с исихастской концепцией усмирения помыслов и буддийской шаматхой.
  related: [samadhi, atman, alayavijnyana, pomysly]

- id: samadhi
  term: "Самадхи"
  original: "samādhi (санскр.)"
  tradition: hindu
  definition: >
    Высшая ступень восьмеричного пути Патанджали: состояние полного погружения ума
    в объект медитации вплоть до слияния с ним. Различают сампраджнята-самадхи
    (с опорой на объект) и асампраджнята (без объекта, чистое сознание). В адвайте —
    нирвикальпа-самадхи: переживание тождества Атман-Брахман без двойственности.
    В буддизме соответствуют дхьяны (ступени медитативного поглощения).
  related: [chitta_vritti, atman, nirvana, turiya]

- id: shabda_brahman
  term: "Шабда-брахман"
  original: "śabda-brahman (санскр.)"
  tradition: hindu
  definition: >
    Концепция Бхартрихари: слово (шабда) есть сам Брахман; речь онтологически первична.
    Языковая форма не накладывается на мысль извне — мысль конститутивно языковая
    (sphota — «взрыв» смысла). Мир разворачивается из единого Слова-Брахмана через
    последовательность vibration → форма → значение. Перекликается с логосом в патристике
    и витгенштейновской связью языка и жизненной формы.
  related: [logos, yazyk_igra, yazyk, sphota]

- id: spanda
  term: "Спанда"
  original: "spanda (санскр.) — вибрация, пульс"
  tradition: hindu
  definition: >
    В кашмирском шиваизме (Абхинавагупта, Васугупта) — первичная вибрация-пульсация
    Шивы-Сознания, через которую оно разворачивается во вселенную. Сознание не статично —
    оно «пульсирует» (спандате): сжимается в индивидуальные формы и раскрывается обратно.
    Практика спанды — узнавание (пратьябхиджня) этого пульса в собственном опыте.
    Параллель с динамической природой сознания в предиктивном кодировании.
  related: [brahman, atman, pratyabhijna]

- id: maya
  term: "Майя"
  original: "māyā (санскр.) — иллюзия, измерение"
  tradition: hindu
  definition: >
    В адвайта-веданте — сила, скрывающая истинную природу Брахмана и проецирующая
    видимость множественного мира. Майя ни реальна (не независима от Брахмана), ни
    нереальна (феноменально действенна) — она «анирвачания» (неопределима). Шанкара:
    авидья (незнание) и майя создают «суперимпозицию» (адхьяса) — наложение
    нереального на реальное. Освобождение — распознавание майи джняной (знанием).
  related: [brahman, atman, pustota]

- id: moksha
  term: "Мокша"
  original: "mokṣa (санскр.) — освобождение"
  tradition: hindu
  definition: >
    Высшая цель индийских духовных традиций: освобождение от цикла перерождений (сансары)
    и от иллюзорного отождествления с эго. В адвайте — осознание своей тождественности
    Брахману; в двайте Мадхвы — вечное блаженное пребывание с личным Богом. Рамана
    Махарши: мокша не достижима усилием — она уже есть наша природа, её нужно узнать.
    Параллель с христианским обожением (феозисом) и буддийской нирваной — при
    концептуальных различиях.
  related: [samadhi, atman, obozhenie, nirvana]

- id: pustota
  term: "Пустота (суньята)"
  original: "śūnyatā (санскр.) — пустотность"
  tradition: buddhist
  definition: >
    Центральное понятие мадхьямаки Нагарджуны: все явления пусты от самобытия (свабхавы) —
    они существуют лишь в зависимости от причин, условий и обозначений. Пустота не
    нигилизм: «относительная истина» феноменального мира действительна. «Пустота пустоты»:
    сама шуньята лишена самобытия. В йогачаре пустота — отсутствие двойственности
    «схватывающего» и «схватываемого». Чандракирти: пустота и зависимое возникновение —
    одно и то же.
  related: [zavisimoye_vozniknoveniye, anatman, maya, dve_istiny]

- id: alayavijnyana
  term: "Алаявиджняна"
  original: "ālayavijñāna (санскр.) — сознание-хранилище"
  tradition: buddhist
  definition: >
    В йогачаре Асанги и Васубандху — восьмое, «базовое» сознание, хранящее «семена»
    (биджа) всех прошлых действий и опытов, созревающих в будущих переживаниях.
    Алаявиджняна — основа иллюзорного «я» и непрерывности потока сознания между
    жизнями. Анализ алаявиджняны предвосхищает современные теории бессознательного
    и предиктивного кодирования как накопления статистических ожиданий.
  related: [dharmy, chitta_vritti, prediktivnoe_kodirovanie, trisvabhava]

- id: dharmy
  term: "Дхармы"
  original: "dharmā (санскр./пали) — элементы бытия"
  tradition: buddhist
  definition: >
    В абхидхарме — мельчайшие мгновенные элементы, из потока которых составляется
    весь опыт: форма, ощущение, сознание, ментальные факторы. Анализ дхарм разрушает
    иллюзию постоянного «я» и вещи — всё лишь поток дхарм. Мадхьямака Нагарджуны
    критикует «дхарматеорию»: сами дхармы пусты от самобытия. Различие реального
    (pāramārtha) и номинального (saṃvṛti) уровней истины.
  related: [pustota, alayavijnyana, anatman]

- id: nirvana
  term: "Нирвана"
  original: "nirvāṇa (санскр.) — угасание, extinguishing"
  tradition: buddhist
  definition: >
    Угасание «огня» жажды, ненависти и заблуждения; состояние, свободное от страдания
    и цикла перерождений (сансары). Тхеравада различает нирвану «с остатком» (при жизни)
    и паринирвану (после смерти). Мадхьямака утверждает, что сансара и нирвана пусты —
    разница только в распознавании. В дзен-буддизме нирвана переживается как «обычный ум»
    (хэйчан синь), здесь и сейчас, без стремления к ней. Сравнима с мокшей и обожением.
  related: [pustota, anatman, moksha]

- id: anatman
  term: "Анатта"
  original: "anātman (санскр.), anattā (пали) — не-я"
  tradition: buddhist
  definition: >
    Одна из трёх черт существования (трилакшана): нет постоянного, неизменного «я».
    То, что мы называем «я», — условное имя для непостоянного потока пяти скандх (форма,
    ощущение, восприятие, формации, сознание). Осознание анатты освобождает от
    цепляния, порождающего страдание. Прямое противопоставление концепции Атмана в
    индуизме — главное доктринальное различие двух традиций.
  related: [pustota, atman, dharmy, skandhi]

- id: zavisimoye_vozniknoveniye
  term: "Зависимое возникновение"
  original: "pratītyasamutpāda (санскр.) — взаимозависимое возникновение"
  tradition: buddhist
  definition: >
    Фундаментальный принцип буддийской онтологии: все явления возникают в зависимости
    от условий и лишены независимого самобытия. Двенадцатизвенная формула (ниданы)
    описывает цепь от невежества (авидья) до старости и смерти. Нагарджуна тождествляет
    зависимое возникновение и пустоту: вещи пусты именно потому, что взаимозависимы.
    В этике: взаимозависимость рождает сострадание как естественный отклик.
  related: [pustota, anatman]

- id: soznaniye
  term: "Сознание"
  original: "consciousness (англ.), сознание (рус.)"
  tradition: shared
  definition: >
    Ключевое понятие всех четырёх традиций — с принципиально различными трактовками.
    Западная философия: проблема квалиа и интенциональности; нейронаука — субстрат.
    Патристика: сознание — нус, орган богопознания. Индуизм: чистое сознание (чит) —
    онтологически первично, тождественно Брахману. Буддизм: сознание (виджняна/читта)
    — поток без постоянного субъекта. Общий вопрос: что означает «каково это быть
    собой»? И возможен ли ответ изнутри самого сознания?
  related: [kvalia, nus, atman, alayavijnyana]

- id: opyt
  term: "Опыт"
  original: "experience (англ.), Erfahrung / Erlebnis (нем.)"
  tradition: shared
  definition: >
    Понятие, объединяющее все традиции: каждая ставит вопрос о природе, источниках и
    пределах опыта. Феноменология: опыт как поток сознания с интенциональной структурой.
    Патристика: духовный опыт богообщения — выше рационального познания. Йога и веданта:
    прямой опыт Атмана (анубхава) — единственный путь к мокше. Буддизм: опыт — поток
    мгновенных актов восприятия без субстанциальной основы. Общий вопрос: можно ли
    описать опыт без его искажения языком?
  related: [kvalia, samadhi, pustota, serdtse]

- id: telo
  term: "Тело"
  original: "body (англ.), Leib / Körper (нем.)"
  tradition: shared
  definition: >
    Все традиции — каждая по-своему — работают с телом. Феноменология Мерло-Понти:
    тело-субъект, «нулевая точка» ориентации в мире. Патристика: тело — «храм Духа»,
    участвует в богообщении через аскезу, пост, поклоны. Йога: тело — инструмент
    трансформации через асаны, пранаяму, мудры. Буддийская медитация начинается с
    «тела как тела» (кая-сати). Общий вопрос: является ли тело препятствием для
    духовного опыта или его необходимым условием?
  related: [voploshchennost, serdtse, chitta_vritti]

- id: transformatsiya
  term: "Трансформация восприятия"
  original: "transformation of perception"
  tradition: shared
  definition: >
    Все четыре традиции описывают возможность радикального изменения способа воспринимать
    реальность как результат духовной практики. Феноменологическая редукция меняет
    «естественную установку». Умная молитва трансформирует восприятие: всё видится
    освящённым. Самадхи открывает Атмана за пеленой вритти. Буддийский инсайт (випассана)
    видит непостоянство (аничча) в каждом явлении. Вопрос: меняется само восприятие
    или меняется то, что воспринимается?
  related: [samadhi, isihazm, nirvana, obozhenie]

- id: nevyrazimoe
  term: "Невыразимое"
  original: "ineffable (англ.), апофатическое (греч.)"
  tradition: shared
  definition: >
    Все четыре традиции указывают на то, что ускользает от языка. Витгенштейн: «О чём
    нельзя говорить, о том следует молчать» (Трактат, 7). Апофатическое богословие:
    Бог превыше всех имён и понятий. Нети-нети («не это, не это») в упанишадах.
    Нагарджуна: пустота невыразима, ибо любое утверждение о ней уже концептуализирует.
    Дзен: коан указывает за пределы концептуального ума. Общий вопрос: молчание как
    отказ или как высшее сказывание?
  related: [kvalia, isihiya, pustota, trudnaya_problema, apofatika]

- id: yazyk
  term: "Язык"
  original: "language (англ.), Sprache (нем.)"
  tradition: shared
  definition: >
    Все традиции проблематизируют отношение языка и опыта: формирует ли язык опыт или
    лишь описывает его? Витгенштейн: язык как форма жизни, а не зеркало мира. Бхартрихари:
    мысль конститутивно языкова, шабда (слово) первична. Патристический логос: Бог говорит
    мир в бытие; молитвенное слово участвует в этом. Буддийская апофатика: концептуальный
    язык скрывает пустоту. Перекрёстная тема всех трёх лекций.
  related: [shabda_brahman, logos, yazyk_igra, nevyrazimoe, apoha]

- id: turiya
  term: "Турья"
  original: "turīya (санскр.) — «четвёртое»"
  tradition: hindu
  definition: >
    В Мандукья-упанишаде и Адвайта-веданте — «четвёртое» по отношению к трём состояниям:
    бодрствованию (джаграт), сну со сновидениями (свапна) и глубокому сну без сновидений (сушупти).
    Турья — не ещё одно состояние в ряду, а свидетельствующее сознание, присутствующее во всех
    трёх, как экран, на котором идут любые фильмы. Адвайта приводит в пользу этого «аргумент
    глубокого сна»: утром мы помним, что спали без сновидений, — значит, сознание не исчезало,
    исчезали только его содержания.
  related: [atman, brahman, samadhi, nevyrazimoe]

- id: sphota
  term: "Спхота"
  original: "sphoṭa (санскр.) — «вспышка», «раскрытие»"
  tradition: hindu
  definition: >
    Ключевое понятие философии языка Бхартрихари: неделимое значение слова или предложения,
    которое «вспыхивает» в понимании целиком, хотя звуки произносятся по очереди и никогда не
    существуют одновременно. Спхота первична по отношению к звукам: не звуки складываются
    в смысл, а единый смысл развёртывается в звучащую речь. Мгновенное схватывание смысла
    Бхартрихари называет пратибха. Понятие сопоставляют с означаемым у Соссюра и смыслом у Фреге.
  related: [shabda_brahman, yazyk, apoha]

- id: pratyabhijna
  term: "Пратьябхиджня"
  original: "pratyabhijñā (санскр.) — «узнавание»"
  tradition: hindu
  definition: >
    Школа кашмирского шиваизма (Утпаладева, Абхинавагупта) и её центральная идея: освобождение —
    не приобретение нового знания, а узнавание того, чем сознание всегда было. Высшая реальность
    понимается не как неподвижная основа, а как живая пульсация самосознания (спанда).
    Абхинавагупта видел привилегированный путь к узнаванию в эстетическом переживании (раса),
    когда граница между «мной» и «этим» на мгновение исчезает.
  related: [spanda, atman, transformatsiya]

- id: atma_vichara
  term: "Атма-вичара"
  original: "ātma-vicāra (санскр.) — «исследование себя»"
  tradition: hindu
  definition: >
    Метод Раманы Махарши: на каждую возникающую мысль спрашивать «кому она пришла?» и, получив
    ответ «мне», спрашивать дальше — «кто я?». Это не размышление на тему «я» и не интроспекция
    содержаний, а разворот внимания от содержаний опыта к их источнику. Критерий подлинности
    такого опыта, как и в других традициях, ищут не во внутреннем впечатлении, а в учителе,
    тексте и плодах жизни — что отвечает на возражение Витгенштейна против «личного языка».
  related: [atman, chitta_vritti, phenomenologiya]

- id: dve_istiny
  term: "Две истины"
  original: "saṃvṛti-satya / paramārtha-satya (санскр.)"
  tradition: buddhist
  definition: >
    Учение Нагарджуны о двух уровнях истины. Условная истина (самвритти-сатья) — мир повседневной
    речи и практики: «передай соль», «вода кипит при ста градусах». Высшая истина
    (парамартха-сатья) — пустота всех вещей от самобытия. Без опоры на условное нельзя указать
    на высшее. Для философии языка это значит: слова работают на своём уровне, но не отражают
    «вещей самих по себе», которых нет. Сравнивают с поздним Витгенштейном.
  related: [pustota, zavisimoye_vozniknoveniye, yazyk_igra, yazyk]

- id: skandhi
  term: "Скандхи"
  original: "skandha (санскр.), khandha (пали) — «груды», «совокупности»"
  tradition: buddhist
  definition: >
    Пять совокупностей, из которых буддизм «собирает» человека: форма или тело (рупа),
    чувство (ведана), восприятие-распознавание (санджня), волевые формирующие факторы (санскара)
    и сознание (виджняна). «Я» — условное имя для их потока, как «колесница» — имя для частей,
    собранных определённым образом (диалог Нагасены и царя Милинды). Ни одна скандха и ни их
    сумма не есть постоянное «я».
  related: [anatman, dharmy, telo, zavisimoye_vozniknoveniye]

- id: trisvabhava
  term: "Трисвабхава (три природы)"
  original: "trisvabhāva (санскр.)"
  tradition: buddhist
  definition: >
    Учение Йогачары о трёх способах существования любого феномена. Вымышленная природа
    (парикальпита) — видение вещей и «я» как самостоятельных. Зависимая природа (паратантра) —
    поток взаимообусловленных процессов сознания. Совершенная природа (паринишпанна) —
    зависимая природа, увиденная без наложения. Йогачаринцы поясняли это примером змеи и верёвки:
    змея — вымысел, верёвка — зависимое сплетение волокон; в отличие от Шанкары, они «распускали»
    и верёвку.
  related: [alayavijnyana, maya, phenomenologiya]

- id: svasamvedana
  term: "Свасамведана"
  original: "svasaṃvedana (санскр.) — «самоосознавание»"
  tradition: buddhist
  definition: >
    В эпистемологии Дигнаги и Дхармакирти — свойство каждого акта познания осознавать не только
    свой объект, но одновременно и самого себя: не позже, рефлексией, а сразу. Вместе с учением
    о прямом восприятии (пратьякша), свободном от понятийного построения (викальпа), это
    буддийский ответ на вопрос о «внутренней стороне» опыта, который сопоставляют с квалиа
    и дорефлексивным самосознанием в феноменологии.
  related: [kvalia, phenomenologiya, apoha, soznaniye]

- id: apoha
  term: "Апоха"
  original: "apoha (санскр.) — «исключение»"
  tradition: buddhist
  definition: >
    Теория значения Дигнаги и Дхармакирти. Слово не указывает на общую сущность («коровность»),
    которой, по буддийской логике, нет, а работает через исключение: «корова» — то, что исключено
    из класса «не-корова». Значение — граница, которую проводит слово, а не вещь, на которую оно
    указывает. Близко к тезису Соссюра «в языке нет ничего, кроме различий». Отсюда вывод:
    язык говорит о классах, а единичное живое «это» восприятия всегда остаётся за словами.
  related: [yazyk, sphota, svasamvedana, konstruirovannaya_emotsiya]

- id: satori
  term: "Сатори (внезапное пробуждение)"
  original: "satori, kenshō (яп.); dùnwù (кит.)"
  tradition: buddhist
  definition: >
    В чань и дзен — внезапное прозрение в природу ума, не состояние транса, а мгновенное видение
    того, что было скрыто привычным различением. Спор «постепенного» и «внезапного» пути
    выражен в «Сутре помоста»: Шэньсю предлагает постоянно протирать зеркало ума, Хуэйнэн отвечает:
    «изначально нет ни одной вещи — куда же сесть пыли?». Коаны, крик и парадоксы Линьцзи —
    техники, ломающие привычное описание, чтобы ученик выпал из него в прямое видение.
  related: [pustota, nevyrazimoe, transformatsiya]

- id: apofatika
  term: "Апофатика"
  original: "ἀπόφασις (греч.) — «отрицание»"
  tradition: patristic
  definition: >
    Путь богопознания через отрицание: о Боге говорят, отрицая все понятия, потому что Он
    превосходит их. Классически выражена у Дионисия Ареопагита («Бог не есть ни свет, ни мрак,
    ни истина, ни заблуждение»); за «божественным мраком» — не ничто, а Личность. Её грамматика
    похожа на «нети, нети» Упанишад и отрицания Нагарджуны, но онтология иная: апофатика очищает
    от идолов ради встречи, а не ради покоя без опоры.
  related: [nevyrazimoe, isihiya, obozhenie, pustota]

- id: pomysly
  term: "Помыслы"
  original: "λογισμοί (греч.)"
  tradition: patristic
  definition: >
    В аскетике (Евагрий Понтийский, Иоанн Лествичник, Исаак Сирин) — навязчивые мысли и образы,
    которые возникают в уме и, будучи приняты, перерастают в страсти — устойчивые навыки
    восприятия, окрашивающие весь мир. Аскетика различает стадии: прилог, сочетание, сложение,
    пленение, страсть. Поток помыслов сопоставляют с «вритти» Патанджали, «потоком сознания»
    Джеймса и семенами алаявиджняны: все они описывают восприятие, обусловленное прошлым.
  related: [chitta_vritti, isihazm, alayavijnyana, serdtse]
